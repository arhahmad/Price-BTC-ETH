<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Crypto Prices</title>
<link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
<style>
:root {
  --header-color: #2d2d2d;
  --background: #121212;
  --surface: #1e1e1e;
  --on-primary: #fff;
  --menu-bg: #1a1a1a;
  --widget-border: 2px solid #3a3a3a;
  --widget-gap: 12px;
  --page-padding: 15px;
  --alert-color: #f44336;
}

* {
  -webkit-tap-highlight-color: transparent;
  -webkit-text-size-adjust: none;
  touch-action: pan-y;
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

html, body {
  height: 100%;
  overflow: hidden;
}

body {
  background-color: var(--background);
  color: var(--on-primary);
  font-family: Tahoma, sans-serif;
  -webkit-touch-callout: none;
  -webkit-user-select: none;
  user-select: none;
  overscroll-behavior-y: contain;
}

.header {
  background-color: var(--header-color);
  padding: 0 var(--page-padding);
  height: 40px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  position: fixed;
  top: 12px;
  left: var(--page-padding);
  right: var(--page-padding);
  z-index: 1000;
  border-radius: 15px;
  box-shadow: 0 4px 12px rgba(0,0,0,.3);
  margin: 0 auto;
  max-width: calc(1200px - var(--page-padding)*2);
  border: 1px solid #333;
}

.header-content { 
  width: 100%; 
  display: flex;
  justify-content: space-between;
  align-items: center;
}

.header-title {
  font-weight: 800;
  font-size: 20px;
  letter-spacing: 1px;
  text-shadow: 0 2px 4px rgba(0,0,0,0.5);
  margin-left: 20px;
}

.menu-btn {
  background: none;
  border: none;
  color: var(--on-primary);
  cursor: pointer;
  padding: 8px;
  border-radius: 50%;
  transition: background-color .3s;
}

.menu-btn:hover { background-color: rgba(255,255,255,.15); }
.menu-btn .material-icons { font-size: 22px; }

.menu {
  position: absolute;
  top: 48px;
  right: 12px;
  background-color: var(--menu-bg);
  border-radius: 12px;
  box-shadow: 0 4px 20px rgba(0,0,0,.4);
  display: none;
  min-width: 200px;
  overflow: hidden;
  z-index: 1001;
  border: 1px solid #444;
}

.menu.show { display: block; }

.menu-item {
  padding: 14px 18px;
  display: flex;
  align-items: center;
  cursor: pointer;
  font-size: 16px;
  transition: background-color 0.2s;
}

.menu-item:hover { background-color: rgba(255,255,255,.08); }
.menu-item .material-icons { 
  margin-right: 14px; 
  font-size: 24px; 
}

.container {
  height: 100vh;
  padding: 65px var(--page-padding) 50px;
  display: flex;
  flex-direction: column;
}

.widgets-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  grid-template-rows: 1fr 1fr;
  gap: var(--widget-gap);
  flex: 1;
  width: 100%;
  height: 100%;
}

.widget {
  background-color: var(--surface);
  border-radius: 12px;
  overflow: hidden;
  border: var(--widget-border);
  display: flex;
  flex-direction: column;
  min-height: 0;
  box-shadow: 0 4px 12px rgba(0,0,0,.2);
  pointer-events: none;
}

.tradingview-widget-container {
  flex: 1;
  min-height: 0;
  width: 100%;
}

.footer {
  text-align: center;
  padding: 15px 0 8px;
  color: #777;
  font-size: 13px;
  margin-top: 15px;
  font-weight: 600;
}

.alert-overlay {
  position: fixed;
  top: 0;
  left: 0;
  right: 0;
  bottom: 0;
  background-color: rgba(0,0,0,0.8);
  z-index: 2000;
  display: none;
  justify-content: center;
  align-items: center;
}

.alert-box {
  background-color: #2d2d2d;
  padding: 25px;
  border-radius: 15px;
  max-width: 85%;
  text-align: center;
  border: 3px solid var(--alert-color);
  animation: pulse 1.5s infinite;
  box-shadow: 0 8px 25px rgba(0,0,0,.5);
}

.alert-title {
  font-size: 20px;
  font-weight: bold;
  margin-bottom: 12px;
}

.alert-message { 
  font-size: 17px; 
  margin-bottom: 18px; 
  line-height: 1.4;
}

.alert-close {
  background-color: var(--alert-color);
  color: white;
  border: none;
  padding: 10px 20px;
  border-radius: 8px;
  cursor: pointer;
  font-weight: bold;
  font-size: 15px;
  transition: background-color 0.2s;
}

.alert-close:hover {
  background-color: #d32f2f;
}

@keyframes pulse {
  0% { transform: scale(1); }
  50% { transform: scale(1.03); }
  100% { transform: scale(1); }
}

@media (max-width: 768px) {
  :root { 
    --page-padding: 12px; 
    --widget-gap: 10px; 
  }
  .header { 
    top: 10px; 
    height: 38px; 
    border-radius: 12px;
  }
  .container { 
    padding: 60px var(--page-padding) 45px; 
  }
  .widget { 
    border-radius: 10px;
  }
  .header-title { 
    font-size: 20px; 
    margin-left: 15px;
  }
  .menu-btn .material-icons { font-size: 20px; }
  .menu { top: 46px; }
}

@media (max-width: 480px) {
  :root { 
    --page-padding: 10px; 
    --widget-gap: 8px; 
  }
  .header-title { 
    font-size: 20px; 
    margin-left: 10px;
  }
  .menu { min-width: 180px; }
  .menu-item { padding: 12px 16px; font-size: 15px; }
}
</style>
</head>
<body>
<div class="header">
  <div class="header-content">
    <div class="header-title">CRYPTO PRICES</div>
    <button class="menu-btn" id="menuBtn">
      <span class="material-icons">menu</span>
    </button>
    <div class="menu" id="menu">
      <div class="menu-item" id="aboutBtn">
        <span class="material-icons">info</span>
        <span>About</span>
      </div>
      <div class="menu-item" id="logoutBtn">
        <span class="material-icons">logout</span>
        <span>Exit</span>
      </div>
    </div>
  </div>
</div>

<div class="container">
  <div class="widgets-grid">
    <!-- BTC/USDT -->
    <div class="widget">
      <div class="tradingview-widget-container">
        <div id="btc_widget"></div>
        <script src="https://s3.tradingview.com/external-embedding/embed-widget-single-quote.js" async>
        {
          "symbol": "BINANCE:BTCUSDT",
          "width": "100%",
          "height": "100%",
          "isTransparent": false,
          "colorTheme": "dark",
          "locale": "en"
        }
        </script>
      </div>
    </div>

    <!-- ETH/USDT -->
    <div class="widget">
      <div class="tradingview-widget-container">
        <div id="eth_widget"></div>
        <script src="https://s3.tradingview.com/external-embedding/embed-widget-single-quote.js" async>
        {
          "symbol": "BINANCE:ETHUSDT",
          "width": "100%",
          "height": "100%",
          "isTransparent": false,
          "colorTheme": "dark",
          "locale": "en"
        }
        </script>
      </div>
    </div>

    <!-- BTC Dominance -->
    <div class="widget">
      <div class="tradingview-widget-container">
        <div id="btc-dominance-chart"></div>
        <script src="https://s3.tradingview.com/external-embedding/embed-widget-mini-symbol-overview.js" async>
        {
          "symbol": "CRYPTOCAP:BTC.D",
          "width": "100%",
          "height": "100%",
          "locale": "en",
          "colorTheme": "dark",
          "isTransparent": false,
          "autosize": true
        }
        </script>
      </div>
    </div>

    <!-- USDT Dominance -->
    <div class="widget">
      <div class="tradingview-widget-container">
        <div id="usdt-dominance-chart"></div>
        <script src="https://s3.tradingview.com/external-embedding/embed-widget-mini-symbol-overview.js" async>
        {
          "symbol": "CRYPTOCAP:USDT.D",
          "width": "100%",
          "height": "100%",
          "locale": "en",
          "colorTheme": "dark",
          "isTransparent": false,
          "autosize": true
        }
        </script>
      </div>
    </div>
  </div>
  <div class="footer">Powered by TradingView</div>
</div>

<div class="alert-overlay" id="alertOverlay">
  <div class="alert-box">
    <div class="alert-title">PRICE ALERT!</div>
    <div class="alert-message" id="alertMessage"></div>
    <button class="alert-close" id="alertClose">DISMISS</button>
  </div>
</div>

<script>
document.addEventListener('dblclick',e=>e.preventDefault(),{passive:!1});
document.addEventListener('gesturestart',e=>e.preventDefault());
document.addEventListener('touchmove',e=>{if(e.scale!==1)e.preventDefault()},{passive:!1});

let wakeLock=null;
async function requestWakeLock(){
  try{
    if('wakeLock'in navigator){
      wakeLock=await navigator.wakeLock.request('screen');
      wakeLock.addEventListener('release',()=>{});
    }
  }catch(err){}
}

document.addEventListener('visibilitychange',()=>{
  if(document.visibilityState==='visible'&&wakeLock===null)requestWakeLock();
});
requestWakeLock();

const menu=document.getElementById('menu'),
      menuBtn=document.getElementById('menuBtn');

menuBtn.addEventListener('click',e=>{
  e.stopPropagation();
  menu.classList.toggle('show');
});
document.addEventListener('click',()=>menu.classList.remove('show'));
menu.addEventListener('click',e=>e.stopPropagation());

document.getElementById('logoutBtn').addEventListener('click',()=>{
  if(confirm('Are you sure you want to exit?')) {
    window.close();
  }
});

document.getElementById('aboutBtn').addEventListener('click',()=>{
  alert('Crypto Prices App v2.0\n\nReal-time cryptocurrency price tracker with TradingView widgets\n• Live BTC/USDT prices\n• Live ETH/USDT prices  \n• BTC Dominance chart\n• USDT Dominance chart');
});
</script>
</body>
</html>
